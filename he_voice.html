<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aihe — He 语音陪伴</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial; max-width:640px; margin:0 auto; padding:24px; background:#fafaf7; color:#222}
  h1{font-size:24px; margin:0 0 8px}
  .sub{color:#666; font-size:14px; margin-bottom:16px}
  #log{border:1px solid #e5e5e5; background:#fff; border-radius:12px; padding:16px; min-height:320px; max-height:60vh; overflow:auto}
  .msg{margin:10px 0; line-height:1.6}
  .user{color:#0b57d0; font-weight:600}
  .he{color:#1a7f37}
  .sys{color:#888; font-size:13px}
  button{font-size:16px; padding:14px 24px; border-radius:999px; border:0; background:#111; color:#fff; cursor:pointer; width:100%; margin-top:12px}
  button.listening{background:#d93025; animation:pulse 1s infinite}
  button:disabled{opacity:0.5}
  button.small{font-size:14px; padding:8px 16px; width:auto; background:#666; margin:6px 4px 0 0}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
  .hint{font-size:12px; color:#888; margin-top:8px; text-align:center}
  .status{font-size:13px; color:#666; margin:8px 0; text-align:center}
  .latency{font-size:11px; color:#999; margin-top:2px}
</style>
</head>
<body>
<h1>aihe — He <span style="font-weight:400; color:#666">26岁 温暖大哥哥</span></h1>
<div class="sub">你只管说话，他会听、会记住、会用男声回你。</div>
<div id="status" class="status">准备就绪</div>
<div id="log">
  <div class="msg sys">He：你好，我是 aihe，想聊什么就直接说吧</div>
</div>
<button id="btn">🎙️ 点击说话</button>
<button id="testTts" class="small">🔊 试男声</button>
<div class="hint">需 Chrome / Edge 并允许麦克风</div>

<script>
const log = document.getElementById('log');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const userId = 'u_he_' + Math.random().toString(36).slice(2,6);
let recognition = null;
let listening = false;
let streaming = false;
let audioCtx = null;
let audioQueue = [];
let audioPlaying = false;
let currentSource = null;

function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = (who==='user'?'你：':'He：') + text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function setStatus(t){ status.textContent = t; }

function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playAudioBlob(blob){
  const ctx = getAudioCtx();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      ctx.decodeAudioData(reader.result, (buf) => {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.onended = resolve;
        src.onerror = reject;
        currentSource = src;
        src.start(0);
      }, (e) => { console.warn('decode err', e); reject(e); });
    };
    reader.readAsArrayBuffer(blob);
  });
}

async function playQueue(){
  if(audioPlaying) return;
  audioPlaying = true;
  while(audioQueue.length > 0){
    const blob = audioQueue.shift();
    try{ await playAudioBlob(blob); }catch(e){ console.warn('play err', e); }
  }
  audioPlaying = false;
  if(!streaming) setStatus('说完啦，继续聊');
}

function stopAudio(){
  if(currentSource){ try{ currentSource.stop(); }catch(e){} currentSource=null; }
  audioQueue = [];
  audioPlaying = false;
}

function cleanTts(text){
  return text
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^#+\s*/gm, '')
    .replace(/[#`~|>_]/g, '')
    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{200D}\u{20E3}\u{E0020}-\u{E007F}]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function fetchTts(text){
  const clean = cleanTts(text);
  if(!clean || clean.length < 2) return null;
  const resp = await fetch('http://localhost:8000/v1/voice/tts', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: clean.slice(0,200), emotion:'warm'})
  });
  if(!resp.ok) return null;
  const blob = await resp.blob();
  if(blob.size < 100) return null;
  return blob;
}

async function streamVoiceChat(text){
  addMsg('user', text);
  setStatus('He 在思考…');
  btn.disabled = true;
  streaming = true;
  const t0 = performance.now();

  try{
    const resp = await fetch('http://localhost:8000/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id:userId, message:text})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buffer = '', sentenceBuf = '';
    const heDiv = addMsg('he', '');
    let firstByteMs = 0, firstAudioMs = 0;
    let ttsInFlight = null;

    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        if(line.startsWith('data: ')){
          const d = line.slice(6).trim();
          if(d==='[DONE]') break;
          try{
            const j = JSON.parse(d);
            if(j.chunk){
              if(!firstByteMs) firstByteMs = Math.round(performance.now() - t0);
              full += j.chunk;
              sentenceBuf += j.chunk;
              heDiv.textContent = 'He：' + full;
              log.scrollTop = log.scrollHeight;

              const sentences = sentenceBuf.split(/(?<=[。！？；\n])/);
              if(sentences.length > 1 && sentences[0].trim().length >= 2){
                const toSpeak = sentences[0].trim();
                sentenceBuf = sentences.slice(1).join('');

                // Pipeline: 等 TTS 完成 → 入队播放
                // 不 await，让文字流继续，但 TTS 串行避免过载
                const speakText = toSpeak;
                if(!ttsInFlight){
                  ttsInFlight = fetchTts(speakText).then(async (blob) => {
                    if(blob){
                      if(!firstAudioMs) firstAudioMs = Math.round(performance.now() - t0);
                      audioQueue.push(blob);
                      playQueue();
                    }
                    ttsInFlight = null;
                  });
                } else {
                  ttsInFlight = ttsInFlight.then(() => fetchTts(speakText)).then(async (blob) => {
                    if(blob){
                      if(!firstAudioMs) firstAudioMs = Math.round(performance.now() - t0);
                      audioQueue.push(blob);
                      playQueue();
                    }
                    ttsInFlight = null;
                  });
                }
                setStatus('He 在说…');
              }
            }
          }catch{}
        }
      }
    }

    // 剩余句子
    if(sentenceBuf.trim()){
      const last = sentenceBuf.trim();
      ttsInFlight = (ttsInFlight || Promise.resolve()).then(() => fetchTts(last)).then(async (blob) => {
        if(blob){ audioQueue.push(blob); playQueue(); }
      });
    }

    if(!full) heDiv.textContent = 'He：（无回复）';

    // 等所有 TTS 完成
    if(ttsInFlight) await ttsInFlight;

    const latDiv = document.createElement('div');
    latDiv.className = 'latency';
    latDiv.textContent = `首字: ${firstByteMs}ms | 首声: ${firstAudioMs || '?'}ms`;
    log.appendChild(latDiv);

  }catch(err){
    setStatus('出错：'+err);
  }finally{
    btn.disabled = false;
    streaming = false;
  }
}

document.getElementById('testTts').onclick = async ()=>{
  const t0 = performance.now();
  const blob = await fetchTts('你好，我是aihe，很高兴认识你。');
  if(blob){
    const ms = Math.round(performance.now() - t0);
    await playAudioBlob(blob);
    setStatus(`男声 ${ms}ms / ${(blob.size/1024).toFixed(1)}KB`);
  }
};

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let useBackendStt = false;
let mediaRecorder = null;
let recordedChunks = [];

if(!SpeechRecognition){
  setStatus('浏览器不支持 WebSpeech，尝试录音上传识别…');
  useBackendStt = true;
}

// WebSpeech path
if(SpeechRecognition && !useBackendStt){
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = ()=>{ listening=true; btn.classList.add('listening'); btn.textContent='🔴 正在听…'; setStatus('正在听…'); };
  recognition.onend = ()=>{ listening=false; btn.classList.remove('listening'); btn.textContent='🎙️ 点击说话'; if(!recognition._handled) setStatus('没听清？再点一次'); };
  recognition.onerror = (e)=>{
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      setStatus('WebSpeech 不可用，切换录音上传…');
      useBackendStt = true;
    } else {
      setStatus('识别出错：'+e.error);
    }
  };
  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript.trim();
    recognition._handled = true;
    if(!text) return;
    streamVoiceChat(text);
  };
}

// Backend STT via MediaRecorder upload
async function startRecording(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, {mimeType:'audio/webm'});
    mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(recordedChunks.length === 0){ setStatus('没录到声音'); return; }
      const blob = new Blob(recordedChunks, {type:'audio/webm'});
      setStatus('识别中…');
      try{
        const form = new FormData();
        form.append('audio', blob, 'recording.webm');
        const resp = await fetch('http://localhost:8000/v1/voice/stt', {method:'POST', body:form});
        const data = await resp.json();
        const text = (data.text || '').trim();
        if(text && text !== '你好'){
          streamVoiceChat(text);
        } else {
          setStatus('没听清，再试一次');
        }
      }catch(err){
        setStatus('STT出错：'+err);
      }
    };
    mediaRecorder.start();
    listening = true;
    btn.classList.add('listening');
    btn.textContent = '🔴 录音中…';
    setStatus('录音中…（再点停止）');
  }catch(err){
    setStatus('麦克风不可用：'+err);
  }
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    listening = false;
    btn.classList.remove('listening');
    btn.textContent = '🎙️ 点击说话';
  }
}

btn.onclick = ()=>{
  if(listening){
    if(useBackendStt) stopRecording();
    else recognition.stop();
    return;
  }
  if(streaming){ stopAudio(); streaming=false; setStatus('已打断'); return; }
  if(useBackendStt) startRecording();
  else try{ recognition.start(); }catch(e){ setStatus('启动失败：'+e); }
};
</script>
</body>
</html>
