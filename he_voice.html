<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aihe — He 语音陪伴</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial; max-width:640px; margin:0 auto; padding:24px; background:#fafaf7; color:#222}
  h1{font-size:24px; margin:0 0 8px}
  .sub{color:#666; font-size:14px; margin-bottom:16px}
  #log{border:1px solid #e5e5e5; background:#fff; border-radius:12px; padding:16px; min-height:320px; max-height:60vh; overflow:auto}
  .msg{margin:10px 0; line-height:1.6}
  .user{color:#0b57d0; font-weight:600}
  .he{color:#1a7f37}
  .sys{color:#888; font-size:13px}
  button{font-size:16px; padding:14px 24px; border-radius:999px; border:0; background:#111; color:#fff; cursor:pointer; width:100%; margin-top:12px}
  button.listening{background:#d93025; animation:pulse 1s infinite}
  button:disabled{opacity:0.5}
  button.small{font-size:14px; padding:8px 16px; width:auto; background:#666; margin:6px 4px 0 0}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
  .hint{font-size:12px; color:#888; margin-top:8px; text-align:center}
  .status{font-size:13px; color:#666; margin:8px 0; text-align:center}
  audio{width:100%; margin-top:8px}
</style>
</head>
<body>
<h1>aihe — He <span style="font-weight:400; color:#666">26岁 温暖大哥哥</span></h1>
<div class="sub">你只管说话，他会听、会记住、会用男声回你。</div>
<div id="status" class="status">准备就绪 — 点下方开始</div>
<div id="log">
  <div class="msg sys">He：你好，阿明，我是 aihe，你的 AI 伙伴。想聊什么就直接说吧 ✨</div>
</div>
<button id="btn">🎙️ 点击说话</button>
<button id="testTts" class="small">🔊 点我直接试男声（不说话）</button>
<button id="testWav" class="small">🎵 试播已生成的 wav</button>
<div class="hint">需 Chrome / Edge 并允许麦克风 · 若无声请看下方音频条手动点播放</div>

<script>
const log = document.getElementById('log');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const userId = 'u_he_voice_' + Math.random().toString(36).slice(2,6);
let recognition = null;
let listening = false;

function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = (who==='user'?'你：':'He：') + text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function setStatus(t){ status.textContent = t; console.log('[status]', t); }

async function playHe(text){
  setStatus('合成男声… ' + text.slice(0,20));
  try{
    const ttsResp = await fetch('http://localhost:8000/v1/voice/tts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: text.slice(0,300), emotion:'warm'})
    });
    console.log('tts status', ttsResp.status, ttsResp.headers.get('content-type'));
    const blob = await ttsResp.blob();
    console.log('tts blob', blob.size, blob.type);
    if(blob.size < 100){
      const txt = await blob.text();
      console.log('tts body', txt.slice(0,200));
      setStatus('TTS 返回异常：' + txt.slice(0,100));
      addMsg('sys', 'TTS 异常：' + txt.slice(0,200));
      return;
    }
    const url = URL.createObjectURL(blob);
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.autoplay = true;
    audio.src = url;
    log.appendChild(audio);
    log.scrollTop = log.scrollHeight;
    setStatus('已生成音频条，请点 ▶️ 播放（若未自动播）');
    try{
      await audio.play();
      setStatus('播放中…');
      audio.onended = ()=> setStatus('播放结束，再点说话继续');
    }catch(e){
      console.log('play blocked', e);
      setStatus('浏览器拦截自动播放，请手动点音频条 ▶️');
    }
    audio.onerror = (e)=> { console.log('audio error', e); setStatus('音频加载失败'); };
  }catch(e){
    console.log('tts fetch fail', e);
    setStatus('TTS 请求失败：'+e);
  }
}

// 测试按钮：不说话直接试男声
document.getElementById('testTts').onclick = async ()=>{
  const t = '你好，我是 aihe，记得你喜欢喝美式，住在上海。很高兴陪你聊天。';
  addMsg('user', '[测试] '+t);
  // 先过 He LLM 再 TTS
  setStatus('He 在思考…');
  try{
    const resp = await fetch('http://localhost:8000/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id:userId, message:t})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let full='', buffer='';
    const heDiv = addMsg('he', '');
    heDiv.textContent = 'He：';
    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        if(line.startsWith('data: ')){
          const d=line.slice(6).trim();
          if(d==='[DONE]') break;
          try{ const j=JSON.parse(d); if(j.chunk){ full+=j.chunk; heDiv.textContent='He：'+full; } }catch{}
        }
      }
    }
    await playHe(full || t);
  }catch(e){ setStatus('出错'+e); }
};
document.getElementById('testWav').onclick = ()=>{
  const a = document.createElement('audio');
  a.controls=true; a.autoplay=true; a.src='/tmp/test_piper.wav';
  // try fetch via backend static? fallback to direct TTS test
  playHe('测试男声，如果你听到这句，TTS 就通了');
};

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SpeechRecognition){
  setStatus('浏览器不支持语音识别，请用 Chrome / Edge');
  btn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = ()=>{ listening=true; btn.classList.add('listening'); btn.textContent='🔴 正在听… 说完会自动发送'; setStatus('正在听…'); };
  recognition.onend = ()=>{ listening=false; btn.classList.remove('listening'); btn.textContent='🎙️ 点击说话'; if(!recognition._handled) setStatus('没听清？再点一次'); };
  recognition.onerror = (e)=>{ setStatus('识别出错：'+e.error); console.log(e); };
  recognition.onresult = async (e)=>{
    const text = e.results[0][0].transcript.trim();
    recognition._handled = true;
    if(!text) return;
    addMsg('user', text);
    setStatus('He 在思考…');
    btn.disabled = true;
    try{
      const resp = await fetch('http://localhost:8000/v1/chat/completions', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user_id:userId, message:text})
      });
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      let buffer = '';
      const heDiv = addMsg('he', '');
      heDiv.textContent = 'He：';
      while(true){
        const {value, done} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, {stream:true});
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for(const line of lines){
          if(line.startsWith('data: ')){
            const data = line.slice(6).trim();
            if(data==='[DONE]') break;
            try{
              const j = JSON.parse(data);
              if(j.chunk){ full += j.chunk; heDiv.textContent = 'He：' + full; log.scrollTop = log.scrollHeight; }
            }catch{}
          }
        }
      }
      await playHe(full);
    }catch(err){
      setStatus('出错：'+err); console.log(err);
      addMsg('sys', '出错：'+err);
    }finally{
      btn.disabled = false;
      setTimeout(()=>{ recognition._handled=false; }, 500);
    }
  };
}

btn.onclick = ()=>{
  if(listening){ recognition.stop(); return; }
  try{ recognition.start(); }catch(e){ setStatus('启动失败：'+e); console.log(e); }
};

// 预热记忆
setTimeout(()=>{
  fetch('http://localhost:8000/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user_id:userId, message:'我叫阿明，喜欢喝美式，住在上海'})
  }).then(()=>console.log('warmup ok')).catch(e=>console.log('warmup fail',e));
}, 800);
</script>
</body>
</html>
