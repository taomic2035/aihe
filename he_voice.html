<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aihe — He 语音陪伴</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial; max-width:640px; margin:0 auto; padding:24px; background:#fafaf7; color:#222}
  h1{font-size:24px; margin:0 0 8px}
  .sub{color:#666; font-size:14px; margin-bottom:16px}
  #log{border:1px solid #e5e5e5; background:#fff; border-radius:12px; padding:16px; min-height:320px; max-height:60vh; overflow:auto}
  .msg{margin:10px 0; line-height:1.6}
  .user{color:#0b57d0; font-weight:600}
  .he{color:#1a7f37}
  .sys{color:#888; font-size:13px}
  button{font-size:16px; padding:14px 24px; border-radius:999px; border:0; background:#111; color:#fff; cursor:pointer; width:100%; margin-top:12px}
  button.listening{background:#d93025; animation:pulse 1s infinite}
  button:disabled{opacity:0.5}
  button.small{font-size:14px; padding:8px 16px; width:auto; background:#666; margin:6px 4px 0 0}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
  .hint{font-size:12px; color:#888; margin-top:8px; text-align:center}
  .status{font-size:13px; color:#666; margin:8px 0; text-align:center}
  audio{width:100%; margin-top:8px}
  .latency{font-size:11px; color:#999; margin-top:4px}
</style>
</head>
<body>
<h1>aihe — He <span style="font-weight:400; color:#666">26岁 温暖大哥哥</span></h1>
<div class="sub">你只管说话，他会听、会记住、会用男声回你。</div>
<div id="status" class="status">准备就绪 — 点下方开始</div>
<div id="log">
  <div class="msg sys">He：你好，我是 aihe，你的 AI 伙伴。想聊什么就直接说吧</div>
</div>
<button id="btn">🎙️ 点击说话</button>
<button id="testTts" class="small">🔊 试男声</button>
<div class="hint">需 Chrome / Edge 并允许麦克风</div>

<script>
const log = document.getElementById('log');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const userId = 'u_he_' + Math.random().toString(36).slice(2,6);
let recognition = null;
let listening = false;

function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = (who==='user'?'你：':'He：') + text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function setStatus(t){ status.textContent = t; }

function cleanTts(text){
  return text
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^#+\s*/gm, '')
    .replace(/[#`~|>_]/g, '')
    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{200D}\u{20E3}\u{E0020}-\u{E007F}]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function playHe(text){
  const clean = cleanTts(text);
  if(!clean) return;
  setStatus('合成男声…');
  const t0 = performance.now();
  try{
    const resp = await fetch('http://localhost:8000/v1/voice/tts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: clean.slice(0,300), emotion:'warm'})
    });
    const blob = await resp.blob();
    const ttsMs = Math.round(performance.now() - t0);
    if(blob.size < 100){ setStatus('TTS异常'); return; }
    const url = URL.createObjectURL(blob);
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.autoplay = true;
    audio.src = url;
    const latDiv = document.createElement('div');
    latDiv.className = 'latency';
    latDiv.textContent = `TTS: ${ttsMs}ms / ${(blob.size/1024).toFixed(1)}KB`;
    log.appendChild(audio);
    log.appendChild(latDiv);
    log.scrollTop = log.scrollHeight;
    setStatus('播放中…');
    try{ await audio.play(); }catch(e){ setStatus('请手动点播放'); }
    audio.onended = ()=> setStatus('播放结束，再点说话继续');
  }catch(e){ setStatus('TTS失败：'+e); }
}

// 快速模式：LLM流式收集，第一句出来就调TTS，后续分句合成
async function chatAndSpeak(text){
  addMsg('user', text);
  setStatus('He 在思考…');
  btn.disabled = true;
  const t0 = performance.now();

  try{
    const resp = await fetch('http://localhost:8000/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id:userId, message:text})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buffer = '', sentenceBuf = '';
    const heDiv = addMsg('he', '');
    let firstTtsDone = false;

    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        if(line.startsWith('data: ')){
          const d = line.slice(6).trim();
          if(d==='[DONE]') break;
          try{
            const j = JSON.parse(d);
            if(j.chunk){
              full += j.chunk;
              sentenceBuf += j.chunk;
              heDiv.textContent = 'He：' + full;
              log.scrollTop = log.scrollHeight;

              // 分句：遇到句号/问号/感叹号/换行就合成
              const sentences = sentenceBuf.split(/(?<=[。！？；\n])/);
              if(sentences.length > 1 && sentences[0].length >= 4){
                const toSpeak = sentences[0];
                sentenceBuf = sentences.slice(1).join('');
                if(!firstTtsDone){
                  firstTtsDone = true;
                  const chatMs = Math.round(performance.now() - t0);
                  setStatus(`首句 ${chatMs}ms → TTS…`);
                }
                await playHe(toSpeak);
              }
            }
          }catch{}
        }
      }
    }
    // 剩余内容
    if(sentenceBuf.trim()){
      await playHe(sentenceBuf);
    }
    if(!full){
      heDiv.textContent = 'He：（无回复）';
    }
    const totalMs = Math.round(performance.now() - t0);
    setStatus(`完成 ${totalMs}ms`);
  }catch(err){
    setStatus('出错：'+err);
    addMsg('sys', '出错：'+err);
  }finally{
    btn.disabled = false;
  }
}

// 试男声
document.getElementById('testTts').onclick = async ()=>{
  addMsg('user', '[试男声]');
  await playHe('你好，我是aihe，记得你喜欢喝美式，住在上海。很高兴陪你聊天。');
};

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SpeechRecognition){
  setStatus('浏览器不支持语音识别，请用 Chrome / Edge');
  btn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = ()=>{ listening=true; btn.classList.add('listening'); btn.textContent='🔴 正在听…'; setStatus('正在听…'); };
  recognition.onend = ()=>{ listening=false; btn.classList.remove('listening'); btn.textContent='🎙️ 点击说话'; if(!recognition._handled) setStatus('没听清？再点一次'); };
  recognition.onerror = (e)=>{ setStatus('识别出错：'+e.error); };
  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript.trim();
    recognition._handled = true;
    if(!text) return;
    chatAndSpeak(text);
  };
}

btn.onclick = ()=>{
  if(listening){ recognition.stop(); return; }
  try{ recognition.start(); }catch(e){ setStatus('启动失败：'+e); }
};
</script>
</body>
</html>
