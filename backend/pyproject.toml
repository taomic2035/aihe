[project]
name = "aihe-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "pydantic>=2.9",
  "httpx>=0.27",
  "qdrant-client>=1.11",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
